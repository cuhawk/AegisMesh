name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: v1.4.2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - run: go test -race -v ./...
      - run: go vet ./...
      - run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2
      - name: Compile and validate example
        run: |
          go run ./cmd/aegismesh compile -intent examples/multitenant.json -previous-tf examples/legacy-iam.tf.json -out "${RUNNER_TEMP}/aegismesh"
          python tests/validate_artifacts.py "${RUNNER_TEMP}/aegismesh"
          go run ./cmd/aegismesh drift -intent examples/multitenant.json -live "${RUNNER_TEMP}/aegismesh/verified-live.json"
          terraform -chdir="${RUNNER_TEMP}/aegismesh" init -backend=false -input=false
          terraform -chdir="${RUNNER_TEMP}/aegismesh" validate
      - name: Compile and validate Wave 3 example
        run: |
          go run ./cmd/aegismesh compile -intent examples/wave3.json -previous-tf examples/legacy-iam.tf.json -out "${RUNNER_TEMP}/aegismesh-wave3"
          python tests/validate_artifacts.py "${RUNNER_TEMP}/aegismesh-wave3" --example wave3.json
          go run ./cmd/aegismesh drift -intent examples/wave3.json -live "${RUNNER_TEMP}/aegismesh-wave3/verified-live.json"
      - name: Compile and validate Wave 4 federation, runtime policy and revision diff
        run: |
          go run ./cmd/aegismesh compile -intent examples/wave4.json -previous-tf examples/legacy-iam.tf.json -out "${RUNNER_TEMP}/aegismesh-wave4"
          go run ./cmd/aegismesh --diff "${RUNNER_TEMP}/aegismesh-wave3/bundle.json" "${RUNNER_TEMP}/aegismesh-wave4/bundle.json" -out "${RUNNER_TEMP}/aegismesh-diff"
          python tests/validate_artifacts.py "${RUNNER_TEMP}/aegismesh-wave4" --example wave4.json --diff-dir "${RUNNER_TEMP}/aegismesh-diff"
          for cluster in east west; do
            go run ./cmd/aegismesh drift -intent examples/wave4.json -cluster "$cluster" -live "${RUNNER_TEMP}/aegismesh-wave4/clusters/$cluster/verified-live.json"
          done
      - run: go run ./benchmarks/run_bench.go
